name: Publish release to PyPI

on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives version from git tags

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Verify built version matches tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(ls dist/onefinance-*.tar.gz | sed -E 's|.*/onefinance-(.+)\.tar\.gz|\1|')
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version '$expected' but hatch-vcs produced '$actual'."
            echo "Common causes: dirty working tree at build time, missing/misformatted tag, or fetch-depth too shallow."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches built version $actual"

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with "dist/onefinance-${GITHUB_REF_NAME#v}-py3-none-any.whl" tests/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with "dist/onefinance-${GITHUB_REF_NAME#v}.tar.gz" tests/smoke_test.py

      - name: Publish
        run: uv publish
