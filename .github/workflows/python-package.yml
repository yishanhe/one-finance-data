name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check onefinance tests

      - name: Format check (ruff)
        run: uv run ruff format --check onefinance tests

      - name: Type check (mypy)
        run: uv run mypy onefinance tests

      - name: Test (pytest, exclude integration)
        run: uv run pytest tests -m "not integration"
